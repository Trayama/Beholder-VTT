<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>墙体属性</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#1c222c; color:#edf1f7; }
    * { box-sizing:border-box; }
    body { margin:0; padding:16px; }
    h1 { font-size:15px; margin:0 0 5px; }
    p { font-size:11px; color:#9ca8b8; margin:0 0 14px; line-height:1.5; }
    label { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid #343d4a; font-size:13px; }
    input { width:17px; height:17px; accent-color:#9a7be8; }
    #status { min-height:18px; color:#d9b76d; font-size:11px; margin:9px 0; }
    footer { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
    button { border:1px solid #485365; background:#2b3441; color:#edf1f7; border-radius:7px; padding:7px 13px; cursor:pointer; }
    button.primary { background:#8d70d8; border-color:#8d70d8; color:#fff; }
    button:disabled { opacity:.45; cursor:default; }
  </style>
  <script type="importmap">
    { "imports": { "@owlbear-rodeo/sdk": "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm" } }
  </script>
</head>
<body>
  <h1>墙体属性</h1>
  <p>设置会应用到整条连续墙体。当前只有视野阻挡映射到 Owlbear 原生 WALL；移动与光照阻挡先保存为独立墙体属性，供对应模块接入。</p>
  <label>阻挡棋子移动 <input id="blocks-movement" type="checkbox" /></label>
  <label>阻挡视野 <input id="blocks-vision" type="checkbox" /></label>
  <label>阻挡光线 <input id="blocks-light" type="checkbox" /></label>
  <div id="status">正在读取…</div>
  <footer><button id="cancel">取消</button><button id="save" class="primary">保存</button></footer>
  <script type="module" src="./wall-properties.js"></script>
</body>
</html>
