<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>光源设置</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:#1a2029; color:#e9edf4; }
    * { box-sizing:border-box; }
    body { margin:0; padding:16px; }
    h1 { font-size:14px; margin:0 0 5px; }
    p { color:#98a4b5; font-size:10px; line-height:1.5; margin:0 0 12px; }
    label { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 2px; border-top:1px solid #343e4c; font-size:11px; }
    input { width:95px; border:1px solid #465262; border-radius:6px; background:#252d39; color:#e9edf4; padding:6px; }
    #status { min-height:24px; color:#d5b574; font-size:10px; line-height:1.45; margin:10px 0 2px; }
    footer { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
    button { border:1px solid #465262; background:#29323e; color:#e9edf4; border-radius:7px; padding:7px 13px; cursor:pointer; font-size:11px; }
    button.primary { background:#8e73d5; border-color:#8e73d5; color:#fff; font-weight:700; }
    button:disabled { opacity:.4; cursor:default; }
  </style>
  <script type="importmap">
    { "imports": { "@owlbear-rodeo/sdk": "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm" } }
  </script>
</head>
<body>
  <h1>光源设置</h1>
  <p>调整光源范围和角度，并可将光源绑定到角色棋子。</p>
  <label>选择光源 <select id="light-source"></select></label>
  <label>绑定棋子 <select id="attached-token"><option value="">不绑定</option></select></label>
  <label>光照半径 <input id="radius" type="number" min="1" step="1" /></label>
  <label>光源柔化半径 <input id="source-radius" type="number" min="0" step="1" /></label>
  <label>衰减 <input id="falloff" type="number" min="0" max="3" step="0.05" /></label>
  <label>内角度 <input id="inner-angle" type="number" min="0" max="360" step="1" /></label>
  <label>外角度 <input id="outer-angle" type="number" min="0" max="360" step="1" /></label>
  <div id="status" role="status"></div>
  <footer><button id="delete-light">删除光源</button><button id="cancel">取消</button><button id="save" class="primary">保存</button></footer>
  <script type="module" src="./light-properties.js"></script>
</body>
</html>
